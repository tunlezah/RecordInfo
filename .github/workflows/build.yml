name: Build RecordInfo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

    - name: Install Dependencies
      run: brew install chromaprint

    - name: Build
      run: |
        xcodebuild -project RecordInfo.xcodeproj \
          -scheme RecordInfo \
          -destination 'platform=macOS' \
          build

    - name: SwiftLint
      continue-on-error: true
      run: |
        brew install swiftlint
        swiftlint lint --reporter github-actions-logging || true
